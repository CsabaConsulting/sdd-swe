[project]
name = "aegis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
    "openai",
    "tenacity",
    "pydantic",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "aiosqlite",
    "imaplib2",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "transformers>=4.45.0",
    "torch>=2.5.0",
    "sentencepiece>=0.2.0",
    "podman>=4.10.0",
    "httpx>=0.27.0",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[tool.uv]
# Use CPU-only PyTorch for AMD hardware (no CUDA)
find-links = ["https://download.pytorch.org/whl/torch_stable.html"]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
]

# Force CPU-only torch installation

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pytest-asyncio]
asyncio_default_fixture_loop_scope = "function"
